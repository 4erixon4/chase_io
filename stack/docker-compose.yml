# =============================================================================
# Phase 2 stack — *arr + Plex on Hetzner, TorBox debrid via Decypharr (download
# mode), Storage Box library, Tailscale-only.
#
# Paths are IDENTICAL in every container (no remote-path mappings):
#   /data/downloads   local VPS disk — Decypharr downloads real files HERE
#   /mnt/box/media    Storage Box (CIFS)  — Radarr/Sonarr copy the library HERE
#
# Every published port binds to ${TS_IP} (the Tailscale interface) only. The
# Hetzner Cloud Firewall stays as a second layer, not the only one.
#
# PUID/PGID come from .env (the single source of truth) and MUST equal the
# fstab uid=1000,gid=1000 on the Storage Box mount.
# =============================================================================

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}

services:
  # --- Download client: Decypharr -> TorBox --------------------------------
  # LOAD-BEARING: Decypharr must run in DOWNLOAD mode so it writes REAL FILES to
  # /data/downloads (not symlinks / not a WebDAV/rclone mount). The whole
  # copy-to-Storage-Box pipeline depends on this. Set the action to "download"
  # in Decypharr's config/first-run wizard and DO NOT switch it to symlink to
  # "save space" later — that silently breaks imports to the Storage Box.
  decypharr:
    image: cy01/blackhole:v2.5          # PINNED — load-bearing; do not float to :latest
    container_name: decypharr
    environment:
      <<: *common-env
      UMASK: "002"
    volumes:
      - /opt/appdata/decypharr:/app          # config.json lives here
      - /data:/data                          # download_folder = /data/downloads
    ports:
      - "${TS_IP}:8282:8282"                 # qBittorrent-mock API + Web UI
    restart: unless-stopped

  # --- Indexers ------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest   # freeze to version-<X> (README)
    container_name: prowlarr
    environment: *common-env
    volumes:
      - /opt/appdata/prowlarr:/config
    ports:
      - "${TS_IP}:9696:9696"
    restart: unless-stopped

  # --- Cloudflare solver for Prowlarr --------------------------------------
  # Lets Prowlarr reach Cloudflare-gated public trackers (1337x, TPB, EZTV,
  # LimeTorrents). Prowlarr talks to it over the internal docker network as
  # http://flaresolverr:8191 (configured as a "FlareSolverr"-type indexer proxy
  # by scripts/setup_stack.py), so NO host port is published. Not user-facing.
  #
  # IMAGE IS BYPARR, not FlareSolverr: FlareSolverr is archived upstream and its
  # last release can no longer solve modern Cloudflare ("Just a moment") — it
  # times out even when healthy. Byparr is the maintained, API-compatible
  # drop-in (same /v1 API, same port 8191). We keep the service NAME
  # "flaresolverr" only so the DNS alias + Prowlarr proxy host stay stable, and
  # because Prowlarr's proxy TYPE is literally called "FlareSolverr".
  # :latest is deliberate here (unlike the rest of the stack) — the solver must
  # track Cloudflare changes; pinning it guarantees it eventually stops working.
  # shm_size is required: the headless Chromium needs shared memory.
  flaresolverr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: flaresolverr
    shm_size: 2gb
    environment:
      PORT: "8191"
      LOG_LEVEL: info
      TZ: ${TZ}
    restart: unless-stopped

  # --- Movies / TV ---------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest     # freeze to version-<X> (README)
    container_name: radarr
    environment: *common-env
    volumes:
      - /opt/appdata/radarr:/config
      - /data:/data                          # source: /data/downloads
      - /mnt/box/media:/mnt/box/media        # dest:   /mnt/box/media/movies
    ports:
      - "${TS_IP}:7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest     # freeze to version-<X> (README)
    container_name: sonarr
    environment: *common-env
    volumes:
      - /opt/appdata/sonarr:/config
      - /data:/data
      - /mnt/box/media:/mnt/box/media        # dest: /mnt/box/media/tv
    ports:
      - "${TS_IP}:8989:8989"
    restart: unless-stopped

  # --- Queue hygiene: REQUIRED (single source, no fallback) ----------------
  # Detects stalled / seederless (dead) TorBox items and triggers a re-search,
  # so one stuck download can't block a request forever.
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:2.10.5   # PINNED (tag has no leading 'v')
    container_name: cleanuparr
    environment: *common-env
    volumes:
      - /opt/appdata/cleanuparr:/config
    ports:
      - "${TS_IP}:11011:11011"
    restart: unless-stopped

  # --- Subtitles (Hebrew via OpenSubtitles) --------------------------------
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest     # freeze to version-<X> (README)
    container_name: bazarr
    environment: *common-env
    volumes:
      - /opt/appdata/bazarr:/config
      - /mnt/box/media:/mnt/box/media        # writes .srt beside the media
    ports:
      - "${TS_IP}:6767:6767"
    restart: unless-stopped

  # --- Requests ------------------------------------------------------------
  # NOTE: sctx/overseerr is DEPRECATED (last release v1.35.0, Feb 2026); the
  # successor is "Seerr". Pinned to 1.35.0 — it still works. Consider migrating
  # to Seerr later (see README).
  overseerr:
    image: sctx/overseerr:1.35.0        # PINNED (deprecated upstream)
    container_name: overseerr
    environment:
      TZ: ${TZ}                              # overseerr manages its own user;
                                             # it never writes to /mnt/box.
    volumes:
      - /opt/appdata/overseerr:/app/config
    ports:
      - "${TS_IP}:5055:5055"
    restart: unless-stopped

  # --- Media server --------------------------------------------------------
  # Official Plex image. Remote access OFF and LAN = 100.64.0.0/10 are set in
  # the Plex UI (see README). PLEX_CLAIM is only needed at first run and EXPIRES
  # 4 MINUTES after you generate it at https://www.plex.tv/claim.
  plex:
    image: plexinc/pms-docker:1.43.3.10896-cb3ebc72d   # PINNED
    container_name: plex
    # HOST NETWORKING (not bridge). A bridge container only sees its own docker
    # IP (172.x) + loopback, so Plex advertised THOSE to plex.tv and every client
    # that relies on discovery (app.plex.tv, phone, TV) failed with "unavailable".
    # On the host network Plex sees the real tailscale0 interface (${TS_IP}) and
    # advertises a reachable address. Tailscale IPs are STABLE per node (assigned
    # once, survive reboots/reconnects), so ${TS_IP} won't drift.
    #
    # SECURITY: in host mode Plex binds 0.0.0.0:32400 (incl. the public IP). The
    # Hetzner firewall (default-deny inbound, only WireGuard/UDP 41641 allowed) is
    # what keeps 32400 off the public internet. Do NOT add a 32400 allow rule.
    network_mode: host
    environment:
      TZ: ${TZ}
      PLEX_UID: ${PUID}                      # keep Plex on the same uid/gid so
      PLEX_GID: ${PGID}                      # it can read the CIFS library
      PLEX_CLAIM: ${PLEX_CLAIM}
      ADVERTISE_IP: "http://${TS_IP}:32400/"
    volumes:
      - /opt/appdata/plex:/config
      - /mnt/box/media:/mnt/box/media
    # No `ports:` in host mode — Plex binds the host's interfaces directly.
    restart: unless-stopped
